<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Movie - Cinematify</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="watch-page">
    <div class="watch-header">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <h2 id="watchTitle">Loading...</h2>
    </div>
    
    <div class="video-container">
        <div class="video-player" id="videoPlayerContainer">
            <video id="mainVideo" poster="" preload="metadata">
                <source id="videoSource" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <div class="video-overlay-play" id="videoOverlay">
                <div class="video-play-btn"><i class="fas fa-play"></i></div>
            </div>
        </div>
        
        <div class="video-controls-bar">
            <button id="playPauseBtn"><i class="fas fa-play"></i></button>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-display"><span id="currentTime">0:00:00</span> / <span id="totalTime">0:00:00</span></span>
            <button id="volumeBtn"><i class="fas fa-volume-up"></i></button>
            <button id="fullscreenBtn"><i class="fas fa-expand"></i></button>
        </div>
    </div>
    
    <div class="movie-details-watch">
        <h2 id="watchTitle2">Movie Title</h2>
        <div class="meta" id="watchMeta">
            <span class="rating"><i class="fas fa-star"></i> 8.0</span>
            <span><i class="fas fa-clock"></i> 2h 00min</span>
            <span><i class="fas fa-film"></i> Action</span>
        </div>
        <p id="watchDesc">Movie description loading...</p>
        
        <div class="cast-section">
            <h4><i class="fas fa-users"></i> Cast</h4>
            <div class="cast-list" id="watchCast">
                
            </div>
        </div>
    </div>
    
    
    <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="index.html#moviehead" class="mobile-nav-item">
            <i class="fas fa-film"></i>
            <span>Movies</span>
        </a>
        <a href="index.html#news" class="mobile-nav-item">
            <i class="fas fa-fire"></i>
            <span>Trending</span>
        </a>
        <a href="signin.html" class="mobile-nav-item">
            <i class="fas fa-user"></i>
            <span>Account</span>
        </a>
    </nav>
    
    <div class="toast" id="toast"></div>
    
    <script src="main.js"></script>
</body>
</html>
