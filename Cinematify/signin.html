<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Cinematify</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="signin-page">
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    
    <div class="signin-container">
        <div class="signin-logo">
            <h1>Cinema<span>tify</span></h1>
            <p>Sign in to continue watching</p>
        </div>
        
        <form class="signin-form" onsubmit="handleSignIn(event)">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="signinEmail" placeholder="Email address" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="signinPassword" placeholder="Password" required>
            </div>
            <div class="signin-options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" onclick="showToast('Password reset link sent!')">Forgot Password?</a>
            </div>
            <button type="submit" class="signin-btn-full">Sign In</button>
        </form>
        
        <div class="signin-divider">or continue with</div>
        
        <div class="social-signin">
            <button onclick="handleSocialSignIn('Google')" title="Sign in with Google"><i class="fab fa-google"></i></button>
            <button onclick="handleSocialSignIn('Facebook')" title="Sign in with Facebook"><i class="fab fa-facebook-f"></i></button>
            <button onclick="handleSocialSignIn('Apple')" title="Sign in with Apple"><i class="fab fa-apple"></i></button>
        </div>
        
        <div class="signin-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script src="main.js"></script>
</body>
</html>
